<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>삼국 패왕전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 90년대 오락실 벨트스크롤 액션, 뜨겁고 요란하게
   IDEA: 금박 두른 검은 옻칠 오락기와 브라운관
   PICTURE: 게임 화면 그 자체
   COLOUR/TYPE: 흑칠 + 금 + 전투의 붉은색, Black Han Sans 마키
   LAYOUT: 마키 → 화면 → 조이스틱·버튼 3개, 폰 한 화면 */
:root{color-scheme:dark;--bg:#0d0505;--gold:#e0b54a;--ink:#f6e7c8}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0,#3a1208,var(--bg) 70%);color:var(--ink);font:16px/1.5 "Noto Sans KR",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:10px 8px 24px;overflow-x:clip;user-select:none;-webkit-user-select:none}
.cab{width:100%;max-width:680px;background:linear-gradient(180deg,#2a1a14,#150c09);border-radius:22px;padding:12px;box-shadow:0 0 0 3px var(--gold),0 18px 40px #000c,inset 0 2px 0 #ffd27a33}
.marq{text-align:center;background:linear-gradient(180deg,#a51b1b,#6a0e0e);border:2px solid var(--gold);border-radius:12px;padding:6px 6px 4px;margin-bottom:10px}
.marq h1{margin:0;font:400 clamp(28px,8vw,44px)/1.05 "Black Han Sans",sans-serif;color:#ffe08a;letter-spacing:.04em;text-shadow:0 3px 0 #3a0505,0 0 16px #ffb34788}
.marq p{margin:0;font-size:12px;color:#ffd9a0}
.bez{background:#050505;border-radius:14px;padding:8px;box-shadow:inset 0 0 0 2px #333}
canvas{display:block;width:100%;aspect-ratio:320/224;image-rendering:pixelated;border-radius:6px;background:#000}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 4px;gap:8px}
.dp{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:2px}
button{font:900 15px "Noto Sans KR",sans-serif;border:0;cursor:pointer;touch-action:none}
.dp button{background:#222;color:#ddd;border-radius:8px;box-shadow:0 3px 0 #000}
.dp button.on{transform:translateY(2px);box-shadow:none;background:#3a3a3a}
.ab{display:grid;grid-template-columns:repeat(2,64px);gap:10px 12px;align-items:end}
.ab button{width:64px;height:64px;border-radius:50%;color:#fff;box-shadow:0 4px 0 #0009,inset 0 2px 0 #fff5;line-height:1.1}
.ab .c{background:#7a3ad0;grid-column:1/3;justify-self:center;width:58px;height:58px;font-size:13px}
.ab .a{background:#d8322c}.ab .b{background:#c99a1f;color:#2a1500}
.ab button.on{transform:translateY(3px);box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.sm{background:#000;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:8px 16px;min-height:44px}
.hint{font-size:13px;color:#e9cfa0}
button:focus-visible{outline:3px solid #fff}
</style>
</head>
<body>
<div class="cab">
<div class="marq"><h1>삼국 패왕전</h1><p>THREE KINGDOMS ARCADE · BELT ACTION</p></div>
<div class="bez"><canvas id="scr" width="640" height="448" aria-label="게임 화면"></canvas></div>
<div class="pad">
<div class="dp"><span></span><button data-k="u" aria-label="위">▲</button><span></span><button data-k="l" aria-label="왼쪽">◀</button><span></span><button data-k="r" aria-label="오른쪽">▶</button><span></span><button data-k="d" aria-label="아래">▼</button><span></span></div>
<div class="ab"><button class="c" data-k="c" aria-label="필살기">필살</button><button class="b" data-k="b" aria-label="점프">점프</button><button class="a" data-k="a" aria-label="공격">공격</button></div>
</div>
<div class="row"><span class="hint">키보드: 방향키 · Z 공격 · X 점프 · C 필살</span><button class="sm" id="mute">소리 켜짐</button></div>
</div>
<script>
{
const D=document.getElementById('scr').getContext('2d');D.imageSmoothingEnabled=false;
const W=320,H=224,GT=116,GB=214;
const gb=document.createElement('canvas');gb.width=W;gb.height=H;const X=gb.getContext('2d');
const sb=document.createElement('canvas');sb.width=170;sb.height=140;const S=sb.getContext('2d');
const ob=document.createElement('canvas');ob.width=170;ob.height=140;const O=ob.getContext('2d');
const OX=85,OY=118;
const F=(n,f)=>`${f?'400':'900'} ${n}px ${f?'"Black Han Sans"':'"Noto Sans KR"'},sans-serif`;
/* ---------- 소리 ---------- */
let AC=null,muted=false,cur=null,want='title',seqT=null;
const NT={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const fq=s=>{const m=s.match(/([A-G])(#?)(\d)/);return 440*Math.pow(2,(NT[m[1]]+(m[2]?1:0)+(+m[3]+1)*12-69)/12)};
const SONG={title:{t:170,m:'A4 - C5 D5 E5 - G5 E5 D5 - C5 A4 - - G4 A4 C5 - D5 E5 D5 C5 A4 - - -',b:'A2 E3 F2 G2'},
stage:{t:120,m:'A4 C5 A4 D5 A4 E5 D5 C5 A4 C5 A4 G5 E5 D5 C5 D5 F4 A4 F4 C5 G4 B4 G4 D5',b:'A2 A2 A2 A2 F2 F2 G2 G2'},
boss:{t:105,m:'E5 - E5 D#5 E5 B4 D5 C5 A4 - A4 C5 E5 - G#4 B4',b:'A2 A2 E2 E2 F2 F2 E2 E2'},
end:{t:220,m:'C5 E5 G5 A5 G5 E5 D5 E5 C5 - - - A4 C5 D5 E5 G5 - E5 - - - - -',b:'C3 A2 F2 G2'}};
function tone(f,type,dur,vol,at=0){if(!AC||muted)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur)}
function start(k){clearInterval(seqT);cur=k;if(!AC||!k)return;const s=SONG[k],m=s.m.split(' '),b=s.b.split(' ');let i=0;seqT=setInterval(()=>{if(muted)return;const n=m[i%m.length];if(n!=='-')tone(fq(n),'square',s.t/1000*.85,.04);if(i%2==0)tone(fq(b[(i/2|0)%b.length]),'triangle',s.t/1000*1.8,.1);i++},s.t)}
const song=k=>{want=k;if(cur!==k)start(k)};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();start(want)}catch(e){}}
const sfx={hit:()=>{tone(160,'square',.07,.09);tone(80,'sawtooth',.1,.06,.03)},swing:()=>tone(520,'triangle',.06,.03),
big:()=>{for(let i=0;i<4;i++)tone(240-i*40,'sawtooth',.14,.07,i*.04)},hurt:()=>{tone(300,'square',.08,.07);tone(150,'square',.12,.07,.06)},
item:()=>['C5','E5','G5'].forEach((n,i)=>tone(fq(n),'square',.1,.05,i*.06)),sel:()=>tone(880,'square',.04,.04),
fire:()=>{for(let i=0;i<10;i++)tone(120+Math.random()*200,'sawtooth',.12,.05,i*.05)},
bolt:()=>{for(let i=0;i<6;i++)tone(900-i*120,'sawtooth',.06,.05,i*.02)}};
document.getElementById('mute').onclick=e=>{initAudio();muted=!muted;e.target.textContent=muted?'소리 꺼짐':'소리 켜짐'};
/* ---------- 입력 ---------- */
const K={};let E={};
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',KeyW:'u',KeyS:'d',KeyA:'l',KeyD:'r',KeyZ:'a',KeyJ:'a',Enter:'a',KeyX:'b',KeyK:'b',Space:'b',KeyC:'c',KeyL:'c'};
const dn=k=>{if(!K[k])E[k]=1;K[k]=1;initAudio()},up=k=>{K[k]=0};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();dn(k)}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)up(k)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
b.addEventListener('pointerdown',e=>{e.preventDefault();dn(k);b.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{up(k);b.classList.remove('on')}))});
/* ---------- 색 ---------- */
const SH={};
function sh(c,a){const k=c+a;if(SH[k])return SH[k];const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
const t=a<0?0:255,p=Math.abs(a);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return SH[k]='#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const PL={
guan:{skin:'#c8432f',hair:'#141414',hat:'#2a8a4a',ar:'#2f7a45',ar2:'#d9a933',pa:'#24402c',robe:'#2f9a50',cape:'#1e6a38',beard:'#121212',lb:1,boot:'#3a2a1a',wp:'#6a3a1a',bl:'#cfeee8',tas:'#d02a2a'},
zhang:{skin:'#d0915e',hair:'#121212',band:'#c22a2a',ar:'#30354f',ar2:'#c09030',pa:'#1c1c24',cape:'#7a1a1a',beard:'#121212',bush:1,boot:'#151515',wp:'#4a2a14',bl:'#e4e4e4',wavy:1},
zhao:{skin:'#f2c79a',hair:'#222',helm:'#dfe3ec',tas:'#d82a2a',ar:'#e6e9f2',ar2:'#3a7ad8',pa:'#34508e',cape:'#2a62c8',boot:'#2a3a6a',wp:'#e0e0e0',bl:'#ffffff'},
yt:{skin:'#e3b07f',hair:'#3a2a1a',hat:'#f0cf3a',ar:'#9a7a48',ar2:'#e8c84a',pa:'#6a5434',boot:'#3a2a1a',wp:'#6a4a2a',bl:'#cfcfcf'},
dz:{skin:'#e0b080',hair:'#2a1a10',helm:'#8a8a8a',tas:'#c82a2a',ar:'#a82424',ar2:'#3a3a3a',pa:'#3a1414',boot:'#222',wp:'#5a3a1a',bl:'#dedede'},
qz:{skin:'#e0b080',hair:'#222',helm:'#5a6a9a',tas:'#e0e0e0',ar:'#2e3a66',ar2:'#c9c9d0',pa:'#1a1a30',boot:'#151515',wp:'#5a3a1a',bl:'#dedede'},
zj:{skin:'#e8c8a8',hair:'#dddddd',hat:'#e8c43a',robe:'#e8c43a',ar:'#d9b22a',ar2:'#a81818',pa:'#8a1a1a',cape:'#a81818',beard:'#eeeeee',lb:1,boot:'#3a2a1a',wp:'#6a3a1a',bl:'#f2d33a'},
lb:{skin:'#f2c08a',hair:'#222',helm:'#d9a933',plume:1,tas:'#d82a2a',ar:'#b81c1c',ar2:'#e0b54a',pa:'#5a1010',cape:'#7a1010',boot:'#3a1010',wp:'#6a6a6a',bl:'#ffffff'},
cc:{skin:'#f0c890',hair:'#222',crown:'#d9a933',robe:'#2a3466',ar:'#1e2650',ar2:'#e0b54a',pa:'#1a1a30',cape:'#5a1020',beard:'#222',boot:'#151515',wp:'#999',bl:'#ffffff'}};
const CH=[
{n:'관우',k:'guan',wpn:'blade',L:62,spd:1.4,dmg:[11,11,19],rng:60,at:[18,18,24],d:'청룡언월도 · 필살: 화룡참(불길)'},
{n:'장비',k:'zhang',wpn:'spear',L:66,spd:1.5,dmg:[9,10,17],rng:64,at:[16,16,22],d:'장팔사모 · 필살: 대지진(충격파)'},
{n:'조운',k:'zhao',wpn:'spear',L:54,spd:1.9,dmg:[7,8,15],rng:54,at:[11,11,16],d:'창 · 필살: 백룡돌격(돌진)'}];
const ED={
sol:{n:'보병',hp:26,spd:.9,dmg:6,rng:36,at:16,wpn:'sword',L:28},
spr:{n:'창병',hp:30,spd:.75,dmg:8,rng:52,at:18,wpn:'spear',L:48},
arc:{n:'궁병',hp:20,spd:.95,dmg:6,rng:0,at:22,wpn:'bow',L:16},
big:{n:'도부수',hp:66,spd:.6,dmg:12,rng:42,at:24,wpn:'axe',L:36,armor:1,sc:1.15},
zj:{n:'장각',hp:300,spd:.65,dmg:10,rng:42,at:18,wpn:'staff',L:44,boss:1,sc:1.2},
lb:{n:'여포',hp:460,spd:1.25,dmg:14,rng:68,at:16,wpn:'halberd',L:64,boss:1,sc:1.25,armor:1},
cc:{n:'조조',hp:520,spd:1.1,dmg:13,rng:44,at:14,wpn:'sword',L:34,boss:1,sc:1.2,armor:1}};
const ST=[
{n:'제1장 황건의 난',s:'누런 두건의 무리가 탁현을 덮쳤다',pal:'yt',bg:0,len:1660,boss:'zj',jars:[260,700,1120],
 w:[{at:0,e:['sol','sol']},{at:330,e:['sol','spr','sol']},{at:700,e:['arc','sol','spr','sol']},{at:1030,e:['big','sol','arc']},{at:1340,e:['zj','sol','sol'],boss:1}]},
{n:'제2장 호로관',s:'천하무적 여포가 관문을 지킨다',pal:'dz',bg:1,len:1750,boss:'lb',jars:[230,650,1100,1380],
 w:[{at:0,e:['spr','sol','sol']},{at:350,e:['arc','arc','spr','sol']},{at:720,e:['big','spr','sol']},{at:1080,e:['big','big','arc','sol']},{at:1430,e:['lb'],boss:1}]},
{n:'제3장 적벽대전',s:'동남풍이 분다. 조조의 누선에 불을 질러라',pal:'qz',bg:2,len:1850,boss:'cc',jars:[250,750,1250,1500],
 w:[{at:0,e:['sol','spr','arc']},{at:370,e:['big','sol','spr','sol']},{at:770,e:['arc','arc','big','spr']},{at:1150,e:['big','big','spr','sol','sol']},{at:1530,e:['cc','spr'],boss:1}]}];
/* ---------- 상태 ---------- */
let scene='title',tick=0,sel=0,stI=0,P=null,ens=[],prj=[],fx=[],pt=[],items=[],cam=0,wi=0,waveOn=0,score=0,lives=3,shake=0,stT=0,cont=0,goT=0,bossE=null,hitStop=0,T=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function newPlayer(c){const d=CH[c];return{...d,c,x:80,y:170,z:0,vx:0,vz:0,face:1,hp:100,mhp:100,mp:0,st:'idle',t:0,combo:0,q:0,inv:60,hit:new Set(),fr:0}}
function loadStage(i){stI=i;ens=[];prj=[];fx=[];pt=[];items=[];cam=0;wi=0;waveOn=0;bossE=null;P.x=80;P.y=170;P.z=0;P.st='idle';P.inv=60;
ST[i].jars.forEach(x=>ens.push({jar:1,x,y:rnd(140,200),z:0,hp:1,st:'idle'}))}
function spawn(id,side,i){const d=ED[id],s=ST[stI],m=1+stI*.3;const e={id,d,x:side?cam+W+24+i*22:cam-24-i*22,y:rnd(GT+14,GB-6),z:0,vx:0,vz:0,face:side?-1:1,
hp:Math.round(d.hp*(d.boss?1:m)),mhp:Math.round(d.hp*(d.boss?1:m)),dmg:Math.round(d.dmg*(1+stI*.2)),pal:d.boss?id:s.pal,wpn:d.wpn,L:d.L,at:d.at,st:'walk',t:0,cd:rnd(30,90),inv:0,fr:0,flash:0,sum:0};
if(d.boss)bossE=e;ens.push(e)}
/* ---------- 텍스트 / 도형 ---------- */
function tx(s,x,y,c='#fff',sz=10,al='left',bh=0){T.push([s,x,y,c,sz,al,bh])}
function drawT(){D.save();D.scale(2,2);D.textBaseline='top';T.forEach(([s,x,y,c,sz,al,bh])=>{D.font=F(sz,bh);D.textAlign=al;D.lineJoin='round';D.lineWidth=bh?3:2.2;D.strokeStyle='#1a0505';D.strokeText(s,x,y);D.fillStyle=c;D.fillText(s,x,y)});D.restore();T=[]}
const rr=(c,x,y,w,h)=>{X.fillStyle=c;X.fillRect(x,y,w,h)};
/* ---------- 캐릭터 그리기 ---------- */
function angleOf(o){const at=Array.isArray(o.at)?o.at[o.combo||0]:(o.at||18);
if(o.st=='atk'){const p=1-o.t/at;const thrust=o.wpn=='spear'||o.wpn=='halberd'&&(o.combo||0)==1;return thrust?{a:-.06,ex:Math.sin(p*Math.PI)*14}:{a:-2.1+p*2.7,ex:0}}
if(o.st=='wind')return{a:-2.3,ex:-5};if(o.st=='jatk')return{a:.95,ex:0};
if(o.st=='sp')return o.k=='zhao'?{a:-.02,ex:10}:o.k=='guan'?{a:-2.4,ex:0}:{a:1.2,ex:4};
if(o.wpn=='bow')return{a:0,ex:0};return{a:-1.1+Math.sin((o.fr||0)*.05)*.04,ex:0}}
function weapon(c,o,pal,L){const P2=(col,pts)=>{c.fillStyle=col;c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fill()};
const t=o.wpn;
if(t=='bow'){c.strokeStyle=sh(pal.wp,-.2);c.lineWidth=2.5;c.beginPath();c.arc(3,0,12,-1.3,1.3);c.stroke();c.fillStyle='#eee';c.fillRect(3,-11,1,22);return}
if(t=='sword'){c.fillStyle='#6a4a1a';c.fillRect(-5,-1.5,8,3);c.fillStyle=pal.ar2;c.fillRect(2,-4,2,8);P2(sh(pal.bl,-.25),[4,-2,4+L*.8,-1,4+L*.8+5,0,4+L*.8,1,4,2]);c.fillStyle=pal.bl;c.fillRect(4,-2,L*.8,1);return}
c.fillStyle=sh(pal.wp,-.3);c.fillRect(-L*.32,-1.5,L,3);c.fillStyle=sh(pal.wp,.25);c.fillRect(-L*.32,-1.5,L,1);
const e=L*.68;
if(t=='blade'){P2(sh(pal.bl,-.3),[e-2,-3,e+6,-14,e+18,-15,e+24,-8,e+20,-4,e+8,3]);P2(pal.bl,[e,-3,e+7,-12,e+17,-13,e+21,-8,e+9,0]);P2('#fff',[e+8,-11,e+17,-12,e+19,-10,e+10,-9]);
P2(pal.ar2||'#d9a933',[e-4,-4,e+1,-4,e+1,4,e-4,4]);c.fillStyle=pal.tas||'#d02a2a';c.fillRect(e-3,4,3,7+Math.sin(tick*.2)*2);return}
if(t=='spear'||t=='halberd'){c.fillStyle=pal.ar2||'#ccc';c.fillRect(e-3,-3,4,6);
if(pal.wavy){P2(sh(pal.bl,-.3),[e,-3,e+5,-1,e+9,-3,e+14,-1,e+20,0,e+14,1,e+9,3,e+5,1,e,3]);c.fillStyle=pal.bl;c.fillRect(e,-1,18,1)}
else{P2(sh(pal.bl,-.3),[e,-4,e+18,0,e,4]);P2(pal.bl,[e,-3,e+16,0,e,-1])}
if(t=='halberd'){P2(sh(pal.bl,-.2),[e-6,-2,e-4,-16,e+6,-18,e+2,-12,e+1,-2]);P2(sh(pal.bl,-.2),[e-6,2,e-4,16,e+6,18,e+2,12,e+1,2])}
c.fillStyle=pal.tas||'#d02a2a';for(let i=0;i<4;i++)c.fillRect(e-4-i,3,2,5+i*2+Math.sin(tick*.25+i)*2);return}
if(t=='axe'){P2(sh(pal.bl,-.35),[e-4,-2,e+4,-16,e+14,-12,e+10,8,e,4]);P2(pal.bl,[e-2,-2,e+5,-13,e+11,-10,e+8,4])}
if(t=='staff'){c.strokeStyle=pal.bl;c.lineWidth=2;c.beginPath();c.arc(e+4,0,6,0,7);c.stroke();c.fillStyle='#fff';c.fillRect(e+8,-4,2,2)}}
